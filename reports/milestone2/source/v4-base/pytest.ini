[pytest]
testpaths = tests
markers =
    slow: real-model or real-data integration checks (run by default; deselect with -m "not slow")
    vm_only: needs the Linux VM (training, attacks, real-data inference); never run locally
    needs_real_data: reads the real processed dataset (hash/audit only, no model)
filterwarnings =
    ignore:Please use quant_min and quant_max:UserWarning
